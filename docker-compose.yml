services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shopkuy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shopkuy}
      POSTGRES_DB: ${POSTGRES_DB:-shopkuy}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shopkuy}"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-shopkuy}:${POSTGRES_PASSWORD:-shopkuy}@db:5432/${POSTGRES_DB:-shopkuy}
      JWT_SECRET: ${JWT_SECRET:-ubah-secret-ini}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@shopkuy.id}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      PORT: 3000
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - uploads:/app/uploads

volumes:
  db_data:
  uploads:
